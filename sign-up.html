<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>زادنا الخير - تسجيل الدخول</title>
    <link rel="stylesheet" href="sign-up.css">
</head>

<body>

    <div class="container">

        <!-- right-section -->
        <div class="right-section">
            <div class="logo">
                <img src="./IMG/Screenshot 2025-12-24 175339.png" class="heart-icon"> <span>زادنا الخير</span>
            </div>

            <h1>تسجيل الدخول</h1>
            <p class="subtitle">مرحباً بعودتك، رجاءً ادخل بياناتك للمتابعة</p>

            <div class="auth-links">
                <a href="sign-up.html" class="auth-link primary">تسجيل دخول</a>
                <a href="log-in.html" class="auth-link secondary">حساب جديد</a>
            </div>

            <form>
                <label>البريد الإلكتروني</label>
                <input type="email" placeholder="example@gmail.com">

                <label>كلمة المرور</label>
                <input type="password" placeholder="••••••••">

                <button class="login-btn">تسجيل الدخول</button>
            </form>

        </div>
        <!--left-section-->
        <div class="left-section">

            <img src="./IMG/pngtree-food-donation-drive-helpers-packing-donations-on-transparent-background-png-image_12498977.png"
                alt="صورة تبرعات" class="hero-img">

            <div class="overlay">
                <h2>معاً لنحفظ النعمة<br>وننشر الخير</h2>

                <div class="cards">
                    <div class="card">
                        <span class="icon">🍴</span>
                        <h4>للمطاعم</h4>
                        <p>إدارة التبرعات بسهولة وتوثيق المساهمة المجتمعية</p>
                    </div>

                    <div class="card">
                        <span class="icon">❤</span>
                        <h4>للجمعيات</h4>
                        <p>استقبال التبرعات وتوزيعها على المستفيدين بسرعة</p>
                    </div>
                </div>
            </div>

        </div>

    </div>

</body>

</html>
