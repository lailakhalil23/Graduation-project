<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <title>زادنا الخير</title>
  <link rel="stylesheet" href="log-in.css">
</head>

<body>

  <div class="page">

    <!-- right-section -->
    <div class="right">

      <div class="logo">
        <img src="./IMG/Screenshot 2025-12-24 175339.png" class="heart-icon"> <span>زادنا الخير</span>
      </div>

      <h2>إنشاء حساب جديد</h2>
      <p class="subtitle">انضم إلينا في مهمتنا لحفظ النعمة ومساعدة</p>

            <div class="auth-links">
                <a href="sign-up.html" class="auth-link primary">تسجيل دخول</a>
                <a href="log-in.html" class="auth-link secondary">حساب جديد</a>
            </div>

      <div class="type-select">
        <div class="type active">🍴 مطعم</div>
        <div class="type">❤ جمعية خيرية</div>
      </div>

      <div class="form-box">
        <h3>🍴 بيانات المطعم</h3>

        <div class="form-row">
          <div class="input">
            <label>اسم المطعم</label>
            <input type="text" placeholder="مثال: مطعم السعادة">
          </div>

          <div class="input">
            <label>جهة الاتصال</label>
            <input type="text" placeholder="اسم جهة الاتصال">
          </div>
        </div>

        <div class="form-row">
          <div class="input">
            <label>العنوان</label>
            <input type="text" placeholder="العنوان التفصيلي للمقر الرئيسي">
          </div>

          <div class="input">
            <label>رقم الترخيص</label>
            <input type="text" placeholder="رقم السجل التجاري">
          </div>
        </div>
      </div>
      <a href="log-in2.html" class="next-btn">التالي</a>
    </div>
    <!--left-section-->
    <div class="left-section">

      <img
        src="./IMG/pngtree-food-donation-drive-helpers-packing-donations-on-transparent-background-png-image_12498977.png"
        alt="صورة تبرعات" class="hero-img">

      <div class="overlay">
        <h2>معاً لنحفظ النعمة<br>وننشر الخير</h2>

        <div class="cards">
          <div class="card">
            <span class="icon">🍴</span>
            <h4>للمطاعم</h4>
            <p>إدارة التبرعات بسهولة وتوثيق المساهمة المجتمعية</p>
          </div>

          <div class="card">
            <span class="icon">❤</span>
            <h4>للجمعيات</h4>
            <p>استقبال التبرعات وتوزيعها على المستفيدين بسرعة</p>
          </div>
        </div>
      </div>

    </div>
  </div>

</body>

</html>
